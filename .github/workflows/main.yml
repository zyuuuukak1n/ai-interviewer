name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm test

      - name: Run Build Check
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          GEMINI_API_KEY: "dummy_key_for_ci_build"
          BETTER_AUTH_SECRET: "dummy_secret_for_ci_build_must_be_32_characters"
          BETTER_AUTH_URL: "http://localhost:3080/tools/ai-interviewer"
          BASE_PATH: "/tools/ai-interviewer"

