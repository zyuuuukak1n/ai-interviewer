services:
  ai-interviewer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interviewer
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BASE_PATH=/tools/ai-interviewer
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/prod.db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://zyuuuukak1n.dev/tools/ai-interviewer
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NEXT_PUBLIC_RP_NAME=AI Interviewer
      - NEXT_PUBLIC_RP_ID=zyuuuukak1n.dev
    volumes:
      - ./data:/app/data

